AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Platform-managed ECS service - runs a container image on the platform's Fargate cluster in the
  private app subnets. Bring any image URI (ECR or public registry); source-to-image builds via
  the GitHub App land in a later phase.

Parameters:
  ServiceName:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,40}$"
  Image:
    Type: String
    Description: Full image URI, e.g. 1234.dkr.ecr.us-east-1.amazonaws.com/my-app:v1
  ContainerPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
  Cpu:
    Type: String
    AllowedValues: ["256", "512", "1024"]
    Default: "256"
  Memory:
    Type: String
    AllowedValues: ["512", "1024", "2048"]
    Default: "512"
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 5
  # Platform wiring (SSM-resolved; defaults target dev)
  AppSubnetsParam:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /platform/dev/network/app-subnets

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /platform/apps/${ServiceName}
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub platform-app-${ServiceName}-exec
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub platform-app-${ServiceName}
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: app
          Image: !Ref Image
          Essential: true
          PortMappings: [{ ContainerPort: !Ref ContainerPort }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub app-${ServiceName}
      Cluster: "{{resolve:ssm:/platform/dev/ecs-cluster}}"
      TaskDefinition: !Ref TaskDef
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref AppSubnetsParam
          SecurityGroups:
            - "{{resolve:ssm:/platform/dev/network/sg-ecs}}"

Outputs:
  ServiceArn: { Value: !Ref Service }
  TaskDefinitionArn: { Value: !Ref TaskDef }
  LogGroupName: { Value: !Ref LogGroup }
