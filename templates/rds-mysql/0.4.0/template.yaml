AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Platform-managed RDS MySQL 8 instance — encrypted, RDS-managed master password in Secrets
  Manager, deployed into the platform's private data subnets.

Parameters:
  Environment:
    Type: String
    Description: Injected by the platform (dev/qa/stg/prod) - suffixes physical names
    Default: dev
  DbIdentifier:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{0,62}$"
  InstanceClass:
    Type: String
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
    Default: db.t4g.micro
  AllocatedStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
  DatabaseName:
    Type: String
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,63}$"
    Default: app
  MultiAz:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  SubnetPlacement:
    Type: String
    AllowedValues: [private, public]
    Default: private
    Description: private = platform data subnets (apps only); public = reachable from allowed CIDR (e.g. DBeaver)
  AllowedCidr:
    Type: String
    Default: ""
    # Empty (private) OR a full CIDR like 203.0.113.7/32. A bare 0.0.0.0 (no mask) is rejected here,
    # so the malformed value never reaches the security group.
    AllowedPattern: '^(([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2]))?$'
    ConstraintDescription: Must be empty or a valid CIDR with a mask, e.g. 203.0.113.7/32
    Description: CIDR allowed to reach 3306 when public, e.g. 203.0.113.7/32 (empty for private)
  # Platform wiring — resolved from SSM, not user-facing (defaults target dev)
  DataSubnetsParam:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /platform/dev/network/data-subnets
  PublicSubnetsParam:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /platform/dev/network/public-subnets

Conditions:
  IsMultiAz: !Equals [!Ref MultiAz, "true"]
  IsPublic: !Equals [!Ref SubnetPlacement, public]
  HasCidr: !Not [!Equals [!Ref AllowedCidr, ""]]
  PublicWithCidr: !And [!Condition IsPublic, !Condition HasCidr]

Resources:
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Data subnets for ${DbIdentifier}
      SubnetIds: !If [IsPublic, !Ref PublicSubnetsParam, !Ref DataSubnetsParam]

  AccessSg:
    Type: AWS::EC2::SecurityGroup
    Condition: PublicWithCidr
    Properties:
      GroupDescription: !Sub MySQL access for ${DbIdentifier}-${Environment} from allowed CIDR
      VpcId: "{{resolve:ssm:/platform/dev/network/vpc-id}}"
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, CidrIp: !Ref AllowedCidr, Description: allowed client CIDR }

  Instance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub ${DbIdentifier}-${Environment}
      Engine: mysql
      EngineVersion: "8.4.5"
      DBInstanceClass: !Ref InstanceClass
      AllocatedStorage: !Ref AllocatedStorageGb
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: dbadmin
      ManageMasterUserPassword: true   # RDS-managed secret; no plaintext anywhere
      MultiAZ: !If [IsMultiAz, true, false]
      DBSubnetGroupName: !Ref SubnetGroup
      VPCSecurityGroups:
        - !If
          - PublicWithCidr
          - !Ref AccessSg
          - "{{resolve:ssm:/platform/dev/network/sg-rds}}"
      PubliclyAccessible: !If [IsPublic, true, false]
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true

Outputs:
  Endpoint: { Value: !GetAtt Instance.Endpoint.Address }
  Port: { Value: !GetAtt Instance.Endpoint.Port }
  MasterSecretArn: { Value: !GetAtt Instance.MasterUserSecret.SecretArn }
