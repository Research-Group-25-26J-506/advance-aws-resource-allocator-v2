AWSTemplateFormatVersion: "2010-09-09"
Description: Platform-managed S3 bucket — versioned, encrypted, Block Public Access enforced.

Parameters:
  Environment:
    Type: String
    Description: Injected by the platform (dev/qa/stg/prod) - suffixes physical names
    Default: dev
  BucketName:
    Type: String
    AllowedPattern: "^[a-z0-9.-]{3,63}$"
  VersioningEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
  StorageClass:
    Type: String
    AllowedValues: [STANDARD, STANDARD_IA, INTELLIGENT_TIERING]
    Default: STANDARD
  ExpireAfterDays:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 3650
    Description: 0 disables expiration

Conditions:
  Versioned: !Equals [!Ref VersioningEnabled, "true"]
  HasExpiry: !Not [!Equals [!Ref ExpireAfterDays, 0]]
  UseTransition: !Not [!Equals [!Ref StorageClass, STANDARD]]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketName}-${AWS::AccountId}-${Environment}
      VersioningConfiguration: !If
        - Versioned
        - { Status: Enabled }
        - !Ref AWS::NoValue
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expiry
            Status: !If [HasExpiry, Enabled, Disabled]
            ExpirationInDays: !If [HasExpiry, !Ref ExpireAfterDays, 3650]
          - Id: transition
            Status: !If [UseTransition, Enabled, Disabled]
            Transitions:
              - StorageClass: !If [UseTransition, !Ref StorageClass, STANDARD_IA]
                TransitionInDays: 30

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub "${Bucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }

Outputs:
  BucketName: { Value: !Ref Bucket }
  BucketArn: { Value: !GetAtt Bucket.Arn }
