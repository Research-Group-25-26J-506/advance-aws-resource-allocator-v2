# Local dev stack (8.06): MySQL + LocalStack now; Loki/Tempo/Grafana/otel-collector join with
# the 4.x observability prompts. Start: make up (or docker compose up -d).
name: platform-local

services:
  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: platform
      MYSQL_USER: platform
      MYSQL_PASSWORD: platform
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,dynamodb,s3,secretsmanager,ssm
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      retries: 10
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - ../templates:/seed-templates:ro

volumes:
  mysql-data: {}
