# ADOT sidecar config, stored at SSM /platform/otel/sidecar/config (6.04, 4.01 scoped).
# Traces -> Tempo via Cloud Map DNS; metrics stay on debug until AMP (4.08) lands.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  otlp/tempo:
    endpoint: tempo.platform.local:4317
    tls:
      insecure: true
  # ADOT v0.40 has no `debug` exporter — its console exporter is `logging`
  logging:
    loglevel: warn
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
