# Version catalog (3.01 enhancement): every dependency pinned here, nowhere else.
[versions]
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
awsSdk = "2.48.0"
jinjava = "2.8.3"
jsonSchemaValidator = "3.0.6"
uuidCreator = "6.1.1"
logstashEncoder = "9.0"
otelStarter = "2.29.0"
archunit = "1.4.2"
testcontainers = "1.21.4"
spotless = "8.8.0"
mysqlConnector = "9.7.0"

[libraries]
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }
aws-sqs = { module = "software.amazon.awssdk:sqs" }
aws-s3 = { module = "software.amazon.awssdk:s3" }
aws-dynamodb = { module = "software.amazon.awssdk:dynamodb" }
aws-cloudformation = { module = "software.amazon.awssdk:cloudformation" }
aws-sts = { module = "software.amazon.awssdk:sts" }
aws-ssm = { module = "software.amazon.awssdk:ssm" }
jinjava = { module = "com.hubspot.jinjava:jinjava", version.ref = "jinjava" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }
logstash-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashEncoder" }
otel-spring-starter = { module = "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter", version.ref = "otelStarter" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
testcontainers-localstack = { module = "org.testcontainers:localstack", version.ref = "testcontainers" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysqlConnector" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
