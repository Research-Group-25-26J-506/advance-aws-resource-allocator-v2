# Local profile: docker-compose stack (dev/docker-compose.yaml). Auth = dev-header bypass.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/platform
    username: platform
    password: platform
  flyway:
    locations: classpath:db/migration,classpath:db/seed   # V999 seed data for E2E

platform:
  aws:
    region: us-east-1
    endpoint-override: http://localhost:4566   # LocalStack
  sqs:
    requests-queue-url: http://localhost:4566/000000000000/platform-requests-dev
  s3:
    templates-bucket: platform-templates-local
  ddb:
    idempotency-table: platform-idempotency-dev

otel:
  sdk:
    disabled: ${OTEL_DISABLED:true}   # flip on when the local collector is up
