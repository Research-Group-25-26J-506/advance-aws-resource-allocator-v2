spring:
  application:
    name: platform-api
  datasource:
    url: jdbc:mysql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:3306}/platform
    username: ${PLATFORM_DB_USER:platform_admin}
    password: ${PLATFORM_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PLATFORM_COGNITO_ISSUER:}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful   # clean ECS rolling deploys (3.01)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness + /readiness

platform:
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint-override: ${PLATFORM_AWS_ENDPOINT:}
  sqs:
    requests-queue-url: ${PLATFORM_REQUESTS_QUEUE_URL:}
  s3:
    templates-bucket: ${PLATFORM_TEMPLATES_BUCKET:}
  ddb:
    idempotency-table: ${PLATFORM_IDEMPOTENCY_TABLE:platform-idempotency-dev}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  resource:
    attributes:
      service.name: platform-api
      deployment.environment: ${PLATFORM_ENV:dev}
