# PR validation (7.03). Path-filtered parallel jobs; a summary job aggregates so branch
# protection needs exactly one required check even when jobs are skipped.
name: pr-validation

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Fork-PR safety (7.03 enhancement): no secrets anywhere in this workflow.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            frontend: ['frontend/**']
            backend: ['backend/**']
            infra: ['infrastructure/**', 'templates/**']
            workflows: ['.github/workflows/**']

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  backend-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@d156388eb19639ec20ade50009f3d199ce1e2808 # v4.1.0
      - name: Build + unit tests + ArchUnit
        working-directory: backend
        run: gradle build -x integrationTest --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/

  cfn-validate:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - name: cfn-lint
        run: cfn-lint 'infrastructure/**/*.yaml' 'templates/**/template.yaml'
      - name: cfn-nag (strict)
        uses: stelligent/cfn_nag@2b41ebbdbfea2b93a5d3d5c9c9a2b1c6c1b3a3a8 # v0.8.10 — pin real SHA on first run
        continue-on-error: true # advisory until the baseline is clean
        with:
          input_path: infrastructure

  openapi-spec:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 20
      - name: Spectral lint
        run: npx --yes @stoplight/spectral-cli lint backend/api/src/main/resources/openapi.yaml --ruleset .github/spectral.yaml

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # the only job that needs it (7.03 enhancement)
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # 0.28.0
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@e2b3eafc8d227b0241d48be5f425d47c2d750a13 # v3.26.10
        with:
          sarif_file: trivy.sarif

  workflow-lint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - name: actionlint
        uses: raven-actions/actionlint@01fce4f43a270a612932cb1c64d40505a029f821 # v2.0.0

  # Single required check for branch protection: green if every triggered job passed
  # ("skipped = success" so path filters don't block merges).
  pr-validation-summary:
    needs: [changes, frontend-lint, backend-build, cfn-validate, openapi-spec, security-scan, workflow-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "One or more required jobs failed" && exit 1
          fi
          echo "All triggered jobs green."
