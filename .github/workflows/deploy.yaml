# Deploy (7.05, simplified to the single-platform model): ONE platform deployment. Resource
# environments (dev/qa/stg/prod) are a property of provisioned resources — the worker assumes
# per-template execution roles that can target other accounts — not separate platform copies.
name: deploy

on:
  workflow_run:
    workflows: [build-images]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-platform # never two overlapping deploys
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 2 # the infra-change detection diffs against the parent commit

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_ROLE_ARN }}
          role-session-name: ${{ github.actor }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish OTel sidecar config
        run: |
          aws ssm put-parameter --name /platform/otel/sidecar/config --type String --overwrite \
            --value "$(cat configs/otel-sidecar.yaml)" >/dev/null

      - name: Seed template registry
        run: |
          BUCKET=$(aws ssm get-parameter --name /platform/dev/templates-bucket --query 'Parameter.Value' --output text)
          # Interim publisher alongside the sync pipeline: never deletes, never overwrites versions
          aws s3 sync templates/ "s3://${BUCKET}/templates/" --size-only

      - name: Detect infrastructure changes
        id: infra
        run: |
          # Full stack pass only when infrastructure changed in this push; a code-only merge
          # just rolls ECS onto the new image tag via a compute-stack update.
          BEFORE="${{ github.event.workflow_run.head_sha || github.sha }}"
          if git diff --quiet "${BEFORE}~1" "${BEFORE}" -- infrastructure/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy stacks in order (infra changed)
        if: steps.infra.outputs.changed == 'true'
        run: |
          set -euo pipefail
          deploy() {
            local name="$1" template="$2"; shift 2
            echo "::group::platform-${name}-dev"
            aws cloudformation deploy \
              --stack-name "platform-${name}-dev" \
              --template-file "$template" \
              --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
              --no-fail-on-empty-changeset \
              --parameter-overrides EnvironmentName=dev "$@"
            echo "::endgroup::"
          }
          deploy network infrastructure/platform/network.yaml NatStrategy=single EndpointProfile=minimal
          deploy data infrastructure/platform/data.yaml DbTier=serverless
          deploy auth infrastructure/platform/auth.yaml
          deploy iam infrastructure/platform/iam.yaml
          deploy observability infrastructure/platform/observability.yaml
          deploy cdn infrastructure/platform/cdn.yaml

      - name: Ship the new image (always)
        run: |
          # New task-def revision pinned to this commit's immutable tag — this IS the
          # "restart ECS with the updated image"; ~2-4 min when nothing else changed.
          SHA=$(git rev-parse --short HEAD)
          aws cloudformation deploy \
            --stack-name platform-compute-dev \
            --template-file infrastructure/platform/compute.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides EnvironmentName=dev ImageTag="${SHA}" Scale=dev

      - name: Roll ECS services and wait for stability
        run: |
          CLUSTER=$(aws ssm get-parameter --name /platform/dev/ecs-cluster --query 'Parameter.Value' --output text)
          for SVC in api worker web-ui; do
            aws ecs update-service --cluster "$CLUSTER" --service "$SVC" --force-new-deployment >/dev/null
          done
          aws ecs wait services-stable --cluster "$CLUSTER" --services api worker web-ui

      - name: Post-deploy smoke test
        run: |
          CDN=$(aws ssm get-parameter --name /platform/dev/cdn-domain --query 'Parameter.Value' --output text)
          curl --retry 5 --retry-delay 10 -fsS "https://${CDN}/healthz"
          curl -s -o /dev/null -w '%{http_code}' "https://${CDN}/api/v1/config" | grep -q 200

      - name: Record deployed SHA
        run: |
          aws ssm put-parameter --name /platform/dev/deployed-sha \
            --value "$(git rev-parse --short HEAD)" --type String --overwrite
