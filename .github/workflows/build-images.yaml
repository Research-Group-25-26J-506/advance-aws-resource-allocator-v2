# Build & push images (7.04). OIDC only — no AWS keys. Push to a -candidate tag, scan, then
# re-tag deployable on pass so a vulnerable tag is never deployable.
name: build-images

on:
  push:
    branches: [main, develop]   # develop is the trunk in this repo
  workflow_dispatch: {}

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation (7.02)
    strategy:
      matrix:
        service: [api, worker, web-ui]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_ROLE_ARN }}
          role-session-name: ${{ github.actor }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Resolve ECR repo from SSM
        id: repo
        run: |
          REPO=$(aws ssm get-parameter --name /platform/dev/ecr-repo --query 'Parameter.Value' --output text)
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build backend jars
        if: matrix.service != 'web-ui'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle bootJar
        if: matrix.service != 'web-ui'
        working-directory: backend
        run: gradle :${{ matrix.service }}:bootJar --no-daemon

      - name: Build + push candidate image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.service == 'web-ui' && 'frontend' || 'backend' }}
          file: ${{ matrix.service == 'web-ui' && 'frontend/Dockerfile' || format('backend/{0}/Dockerfile', matrix.service) }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false # ECR rejects attestation manifests (400 on manifest PUT)
          tags: ${{ steps.repo.outputs.repo }}:${{ matrix.service }}-${{ steps.repo.outputs.sha }}-candidate
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan candidate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.repo.outputs.repo }}:${{ matrix.service }}-${{ steps.repo.outputs.sha }}-candidate
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Promote candidate to deployable tag
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.repo.outputs.repo }}:${{ matrix.service }}-${{ steps.repo.outputs.sha }}" \
            "${{ steps.repo.outputs.repo }}:${{ matrix.service }}-${{ steps.repo.outputs.sha }}-candidate"
