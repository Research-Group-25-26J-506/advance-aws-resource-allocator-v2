# Build & push images (7.04). OIDC only — no AWS keys. Push to a -candidate tag, scan, then
# re-tag deployable on pass so a vulnerable tag is never deployable.
name: build-images

on:
  push:
    branches: [main, develop]   # develop is the trunk in this repo
  workflow_dispatch: {}

concurrency:
  group: build-images
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation (7.02)
    strategy:
      matrix:
        service: [api, worker, web-ui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.CI_DEPLOY_ROLE_ARN }}
          role-session-name: ${{ github.actor }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Resolve ECR repo from SSM
        id: repo
        run: |
          REPO=$(aws ssm get-parameter --name /platform/dev/ecr-repo --query 'Parameter.Value' --output text)
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build backend jars
        if: matrix.service != 'web-ui'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle bootJar
        if: matrix.service != 'web-ui'
        working-directory: backend
        run: gradle :${{ matrix.service }}:bootJar --no-daemon

      - name: Build + push candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.service == 'web-ui' && 'frontend' || 'backend' }}
          file: ${{ matrix.service == 'web-ui' && 'frontend/Dockerfile' || format('backend/{0}/Dockerfile', matrix.service) }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false # ECR rejects attestation manifests (400 on manifest PUT)
          tags: ${{ steps.repo.outputs.repo }}:${{ matrix.service }}-${{ steps.repo.outputs.sha }}-candidate
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan candidate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.repo.outputs.repo }}:${{ matrix.service }}-${{ steps.repo.outputs.sha }}-candidate
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Promote candidate to deployable tag
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.repo.outputs.repo }}:${{ matrix.service }}-${{ steps.repo.outputs.sha }}" \
            "${{ steps.repo.outputs.repo }}:${{ matrix.service }}-${{ steps.repo.outputs.sha }}-candidate"
